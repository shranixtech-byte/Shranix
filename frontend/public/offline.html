<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SHRANIX Krushi ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f8fafc; color: #1e293b;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1a4d2e; }
    p { color: #64748b; margin-bottom: 1.5rem; line-height: 1.5; }
    .status {
      display: inline-block; padding: 0.5rem 1rem;
      background: #fef3c7; color: #92400e; border-radius: 999px;
      font-size: 0.875rem; font-weight: 500;
    }
    .retry-btn {
      display: inline-block; margin-top: 1.5rem;
      padding: 0.75rem 2rem; background: #1a4d2e; color: white;
      border: none; border-radius: 0.5rem; font-size: 1rem;
      cursor: pointer; transition: background 0.2s;
    }
    .retry-btn:hover { background: #143d24; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      h1 { color: #4ade80; }
      .status { background: #422006; color: #fbbf24; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Your connection to SHRANIX ERP has been interrupted. Some features may be unavailable until you're back online.</p>
    <div class="status">Cached data is available</div>
    <br />
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
