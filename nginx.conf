# ── SHRANIX Krushi ERP — Nginx Production Configuration ────

upstream backend {
    server backend:4001;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.shranix.com;

    # ── SSL (configure with actual certificates) ──────────────
    ssl_certificate     /etc/ssl/certs/shranix.crt;
    ssl_certificate_key /etc/ssl/private/shranix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    # ── Client Limits ─────────────────────────────────────────
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ── API Proxy ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # ── SPA Routing ───────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(html|json)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ── Health Check ──────────────────────────────────────────
    # Health endpoints are excluded from the /api prefix and URI-versioned (v1).
    location /v1/health {
        proxy_pass http://backend/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Redirect legacy /health for backwards compatibility
    location = /health {
        return 301 /v1/health;
    }
}

# ── Rate Limiting Zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
