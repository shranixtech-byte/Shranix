version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shranix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shranix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shranix123}
      POSTGRES_DB: ${POSTGRES_DB:-shranix_erp}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shranix']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shranix-network

  # ── Redis Cache & Queue ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shranix-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shranix-network

  # ── MinIO Storage ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: shranix-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shranix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shranix123}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - shranix-network

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: shranix-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgres://shranix:shranix123@postgres:5432/shranix_erp
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-shranix}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-shranix123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-minimum-32-chars-long!!}
      JWT_EXPIRES_IN: '86400'
      DMS_STORAGE_PATH: /app/storage/dms
    ports:
      - '4001:4001'
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:4001/v1/health/live',
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - shranix-network

  # ── Frontend SPA ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: shranix-frontend
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - shranix-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:

networks:
  shranix-network:
    driver: bridge
